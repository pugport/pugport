name: Issue lifecycle

# Every run reconciles all issues against the open PRs, so no pull_request_target
# trigger is needed: GitHub blocks it by default in public repositories from
# 2026-12-02. The daily run refreshes `in-flight` and claim leases.
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 9 * * *'

permissions:
  # Required to check out trusted default-branch scripts.
  contents: read
  issues: write
  pull-requests: read

# One metadata writer; reconciliation drains coalesced pending events.
concurrency:
  group: issue-lifecycle
  cancel-in-progress: false

jobs:
  reconcile:
    # shortcut: leading whitespace delays commands until reconciliation; upgrade if Actions adds trimming.
    if: github.event_name != 'issue_comment' || (!github.event.issue.pull_request && (startsWith(github.event.comment.body, '/claim') || startsWith(github.event.comment.body, '/unclaim') || startsWith(github.event.comment.body, '/renew')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # No npm install and no PR-head checkout with write permission.
      - run: node scripts/issue-lifecycle.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIFECYCLE_MAINTAINER: Yutong43
